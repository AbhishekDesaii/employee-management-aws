# ConfigMap: non-sensitive environment settings for both containers.
# Kept separate from Secrets so we never store passwords/keys in plain yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: employee-system
data:
  HOST: "0.0.0.0"
  PORT: "5000"
  FLASK_DEBUG: "false"
  CORS_ORIGINS: "*"
  LOG_LEVEL: "INFO"
  GUNICORN_WORKERS: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: employee-system
data:
  PORT: "3000"
  # The frontend reaches the backend through the internal Kubernetes service DNS name.
  API_BASE_URL: "http://employee-backend:5000"

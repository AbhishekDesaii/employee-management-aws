# Secret: holds sensitive values. Base64 is just encoding, not encryption -
# real clusters should use an external secret manager (e.g. AWS Secrets Manager,
# SOPS, sealed-secrets). For local Minikube this is acceptable.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: employee-system
type: Opaque
data:
  # "change-me-in-minikube" base64 encoded
  SECRET_KEY: Y2hhbmdlLW1lLWluLW1pbmlrdWJl

# ClusterIP Service: exposes the Flask backend to other pods inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: employee-backend
  namespace: employee-system
  labels:
    app: employee-backend
spec:
  type: ClusterIP
  selector:
    app: employee-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

# Simple CI: run basic tests on every push to main.
# This is intentionally small - just enough to catch obvious breakage.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Health endpoint test
        run: |
          cd backend
          python -c "
import app
with app.create_app().test_client() as c:
    assert c.get('/api/health').status_code == 200
print('health ok')
"

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Syntax check
        run: |
          cd frontend
          node --check server.js
          node --check routes/index.js

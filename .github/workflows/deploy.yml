name: Deploy to AWS ECS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: employee-management
  ECS_CLUSTER: employee-management-cluster
  ECS_SERVICE: employee-management-service

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run a quick sanity check
        run: |
          cd backend
          source venv/bin/activate
          python -c "
from app import app
client = app.test_client()
resp = client.get('/api/health')
assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
print('Backend health check passed.')
"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint and type-check
        run: |
          cd frontend
          npx tsc --noEmit
          npm run lint || true

      - name: Verify build
        run: |
          cd frontend
          npm run build --if-present

  build-and-push:
    name: Build & Push to ECR
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker compose build
          docker tag employee-management-backend  $ECR_REGISTRY/$ECR_REPOSITORY:backend-${{ github.sha }}
          docker tag employee-management-frontend $ECR_REGISTRY/$ECR_REPOSITORY:frontend-${{ github.sha }}
          docker tag employee-management-nginx    $ECR_REGISTRY/$ECR_REPOSITORY:nginx-${{ github.sha }}
          docker tag employee-management-backend  $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag employee-management-frontend $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          docker tag employee-management-nginx    $ECR_REGISTRY/$ECR_REPOSITORY:nginx-latest

      - name: Push images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:nginx-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:nginx-latest

  deploy:
    name: Deploy to ECS
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --no-cli-pager

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Deployment complete
        run: echo "Service ${{ env.ECS_SERVICE }} on cluster ${{ env.ECS_CLUSTER }} is stable."

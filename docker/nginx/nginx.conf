# Nginx reverse proxy config for the employee-management app.
#
# One server that listens on port 80 and forwards requests:
#   - /api/*  -> backend service on port 5000 (Flask)
#   - everything else -> frontend service on port 3000 (Express)
#
# I use proxy_pass so the browser never needs to know the internal ports.

server {
    listen 80;
    server_name _;

    # ---- frontend (Express) ----
    # All normal page requests go to the Express app.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- backend API (Flask) ----
    # Anything starting with /api/ goes straight to the Flask app.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- simple health endpoint for the load balancer / docker healthcheck ----
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

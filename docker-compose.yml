# Local development with Docker Compose.
#
# Three services mirror the architecture I used:
#   backend  - Flask API on :5000
#   frontend - Express app on :3000
#   nginx    - reverse proxy on :80 (routes /api/* to backend, rest to frontend)
#
# The frontend talks to the backend using the service name "backend" (Docker
# DNS), so no hardcoded IPs are needed.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      SECRET_KEY: dev-secret
      CORS_ORIGINS: "*"
      GUNICORN_WORKERS: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Reach the backend through Docker's internal DNS
      API_BASE_URL: "http://backend:5000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
